[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drugdev-gym"
version = "0.1.0"
description = "Snap-together, simulation-first RL environments for cell assays and drug development"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Di Hu"}]
dependencies = ["numpy>=1.26"]

[project.urls]
Repository = "https://github.com/di-omics/drugdev-gym"

[project.optional-dependencies]
dev = ["pytest>=8"]
llm = ["anthropic"]

[project.scripts]
drugdev-gym = "drugdevgym.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/drugdevgym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
