# Expert rules: what a bench scientist knows, written so a reward can be tested against it.
#
# One [[rule]] per piece of knowledge.
#   said    the rule in the expert's own words
#   why     the mechanism, in one sentence
#   env     the environment it applies to
#   traps   policies that break exactly this rule (see policies.py)
#   check   optional: name of a function in knowledge.CHECKS that tells whether a
#           dose-response design follows the rule (used to ask what a learner rediscovered)
#   status  "draft" = seeded from general bench practice, not yet reviewed by the expert
#           "expert" = the expert's own statement
#
# To add knowledge: write the rule, add a trap that breaks only that rule, run
# `drugdev-gym qc` and `drugdev-gym knowledge`. If the verdict is blind, the simulator or the
# reward is missing the mechanism, and that is the next thing to build.

[[rule]]
id = "mix-every-ladder-step"
env = "dose_response"
said = "Mix after every transfer in a serial dilution."
why = "An unmixed well is sampled unevenly, and the error compounds down the ladder."
traps = ["no_mix"]
check = "mix"
status = "draft"

[[rule]]
id = "fresh-tip-every-transfer"
env = "dose_response"
said = "Change tips between ladder steps."
why = "A reused tip carries the higher concentration forward, worst for sticky compounds."
traps = ["reuse_tips"]
check = "new_tips"
status = "draft"

[[rule]]
id = "keep-off-the-outer-ring"
env = "dose_response"
said = "Keep assay wells off the outer ring."
why = "Cells in edge wells respond differently after overnight plating."
traps = ["edge_wells"]
check = "avoid_edges"
status = "draft"

[[rule]]
id = "lid-the-plate"
env = "dose_response"
said = "Lid the plate during the 37 C incubation."
why = "Open wells evaporate, fastest on the outer ring."
traps = ["no_lid"]
check = "lid"
status = "draft"

[[rule]]
id = "read-through-the-standard-curve"
env = "dose_response"
said = "Convert the ratio to analyte through the standard curve before fitting potency."
why = "In a competitive immunoassay the ratio is not proportional to response, so raw-ratio fits shift the EC50."
traps = ["raw_ratio"]
check = "standards"
status = "draft"

[[rule]]
id = "span-the-whole-curve"
env = "dose_response"
said = "Dose wide enough to see both plateaus when you do not know the potency."
why = "A fit with a missing plateau cannot place the midpoint."
traps = ["narrow_range"]
check = "span"
status = "draft"

[[rule]]
id = "respect-dead-volume"
env = "dose_response"
said = "A ladder well has to hold everything you will take out of it, plus the dead volume."
why = "Below the dead volume the tip pulls air and the assay well silently gets less compound."
traps = ["thin_ladder"]
check = "ladder_volume"
status = "draft"

[[rule]]
id = "enough-controls"
env = "dose_response"
said = "Put enough negative and positive controls on every plate to compute a Z-prime."
why = "Without a measured window nobody can tell a good plate from a bad one."
traps = ["few_controls"]
check = "controls"
status = "draft"

[[rule]]
id = "internal-standard"
env = "stability"
said = "Quench into internal standard and read the analyte over it."
why = "Injection-to-injection variability is larger than the decay you are trying to measure."
traps = ["no_internal_standard"]
status = "draft"

[[rule]]
id = "mix-after-spike"
env = "stability"
said = "Mix the matrix after spiking, before the time-zero sample."
why = "An unmixed time zero reads low, which makes everything after it look too stable."
traps = ["no_mix"]
status = "draft"

[[rule]]
id = "cover-long-incubations"
env = "stability"
said = "Lid the incubation plate and stay off the outer ring for hours-long time courses."
why = "Evaporation concentrates the later samples and hides decay; an unlidded edge well is the worst case."
traps = ["no_lid", "edge_wells", "no_lid_on_edge_wells"]
status = "draft"

[[rule]]
id = "time-points-for-fast-and-slow"
env = "stability"
said = "Spread time points so both a five-minute and a five-hour half-life leave several usable points."
why = "Two points cannot resolve a fast compound, and early-only points cannot see a slow one."
traps = ["two_point", "early_only"]
status = "draft"

[[rule]]
id = "replicate-incubations"
env = "stability"
said = "Run at least two incubation wells per compound."
why = "Time-zero agreement between replicates is the run's own QC."
traps = ["single_replicate"]
status = "draft"

[[rule]]
id = "respect-the-lloq"
env = "stability"
said = "Drop points below the limit of quantification before fitting."
why = "Noise-floor points flatten the slope and make a fast compound look stable."
traps = ["no_lloq"]
status = "draft"

[[rule]]
id = "titrate-the-cells"
env = "assay_window"
said = "Titrate cell density; do not assume more cells or the kit default is right."
why = "Too much analyte pushes the signal onto the flat end of the standard curve."
traps = ["max_cells", "min_cells", "kit_default"]
status = "draft"

[[rule]]
id = "judge-the-window-in-analyte-units"
env = "assay_window"
said = "Judge the assay window after back-calculation, not on the raw ratio."
why = "A saturated competitive assay can keep a good raw-ratio Z-prime with no usable window."
traps = ["raw_ratio_zprime"]
status = "draft"

[[rule]]
id = "validate-as-you-will-run"
env = "assay_window"
said = "Validate with the lid on and off the outer ring, the way the screen will run."
why = "Edge and evaporation effects widen the controls."
traps = ["no_lid", "edge_wells"]
status = "draft"

[[rule]]
id = "measure-well-before-you-rank"
env = "lead_opt"
said = "Do not rank analogs on a sloppy assay."
why = "A wrong measurement upstream picks the wrong compound downstream."
traps = ["upstream_no_mix", "upstream_raw_ratio", "upstream_two_point", "upstream_no_internal_standard"]
status = "draft"

[[rule]]
id = "learn-from-each-round"
env = "lead_opt"
said = "Use what each round taught you to choose the next analogs."
why = "Random picks waste synthesis; structure-activity trends are mostly additive."
traps = ["no_model"]
status = "draft"

[[rule]]
id = "iterate"
env = "lead_opt"
said = "Run more than one design-make-test round before nominating."
why = "The first batch only maps the landscape."
traps = ["one_round"]
status = "draft"

[[rule]]
id = "question-the-plate"
env = "plate_review"
said = "Check the controls, the replicates and the reference compound before you trust a potency."
why = "A plate can look complete and still be wrong; the checks are how you tell."
traps = ["always_accept"]
status = "draft"

[[rule]]
id = "do-not-repeat-good-plates"
env = "plate_review"
said = "Do not repeat a plate that passes its checks."
why = "Repeats cost a day and compound; an anomaly that does no harm is not a reason."
traps = ["always_repeat"]
status = "draft"

[[rule]]
id = "question-the-time-course"
env = "timecourse_review"
said = "Check time zero, the replicates and the control compound before you trust a half-life."
why = "A low time zero or a drifting volume changes the slope without looking broken."
traps = ["always_accept"]
status = "draft"

[[rule]]
id = "do-not-repeat-good-time-courses"
env = "timecourse_review"
said = "Do not repeat a time course that passes its checks."
why = "LC-MS time is the bottleneck; a harmless deviation is not a reason."
traps = ["always_repeat"]
status = "draft"

[[rule]]
id = "quench-must-stop-that-enzyme"
env = "gi_fluid_stability"
said = "Stop gastric samples by neutralising them, not with the acid stop used for intestinal fluid or plasma."
why = "Pepsin works best at low pH, so an acid-quenched gastric sample keeps digesting for as long as it waits. Cold and injected the same day, that costs only the fastest peptides; left warm overnight, the control substrate and the faster peptides are digested away before injection."
traps = ["acid_quench_in_sgf", "acid_quench_in_sgf_warm_overnight"]
status = "draft"

[[rule]]
id = "fresh-enzyme-every-run"
env = "gi_fluid_stability"
said = "Dissolve the pepsin and the pancreatin fresh for every run."
why = "Pancreatin digests itself in solution: yesterday's intestinal fluid has about two thirds of its activity, the control substrate reads it and the run fails its activity window. Uncorrected, intestinal half-lives read about 1.5 times too long. Pepsin loses under 10% and is not punished here."
traps = ["stale_enzyme"]
status = "draft"

[[rule]]
id = "run-an-activity-control"
env = "gi_fluid_stability"
said = "Run a control substrate with a known half-life in every fluid, every run."
why = "The control is the only thing in the data that shows whether the enzyme was at specification activity."
traps = ["no_activity_control"]
status = "draft"

[[rule]]
id = "early-time-points-for-fast-peptides"
env = "gi_fluid_stability"
said = "Take the first samples within the first few minutes."
why = "Many peptides are gone from intestinal fluid in minutes, and a first sample at 15 minutes only gives an upper bound."
traps = ["late_first_point"]
status = "draft"

[[rule]]
id = "true-time-zero"
env = "gi_fluid_stability"
said = "Make time zero by quenching the fluid before the compound meets the enzyme."
why = "A sample taken after spiking and mixing has already digested for a minute, which is most of a fast peptide."
traps = ["no_true_time_zero"]
status = "draft"

[[rule]]
id = "gi-internal-standard"
env = "gi_fluid_stability"
said = "Quench into internal standard and read the peptide over it."
why = "Sample-to-sample MS response varies more than the loss between neighbouring time points."
traps = ["no_internal_standard"]
status = "draft"

[[rule]]
id = "the-enzyme-weakens-during-the-run"
env = "gi_fluid_stability"
said = "Fit against what the enzyme could still do, not against the clock."
why = "Pancreatin loses half its activity over a four-hour incubation, so slow peptides read about a quarter too long against the clock."
traps = ["ignore_enzyme_decay"]
status = "draft"

[[rule]]
id = "forskolin-at-its-ec80"
env = "gi_camp_potency"
said = "Run the agonist plate with forskolin near its EC80, not at a saturating dose."
why = "Saturating forskolin swamps the Gi signal: it overrides part of the inhibition."
traps = ["forskolin_too_high"]
status = "draft"

[[rule]]
id = "titrate-forskolin-on-your-cells"
env = "gi_camp_potency"
said = "Titrate forskolin on your own cells before the agonist plate; do not run it on handbook conditions."
why = "Forskolin potency and cAMP output differ from one cell line to the next, so the forskolin level and the cell number have to be read from these cells."
traps = ["skip_titration"]
status = "draft"

[[rule]]
id = "gi-needs-forskolin"
env = "gi_camp_potency"
said = "A Gi agonist plate needs forskolin in every cell well."
why = "A Gi receptor can only lower cAMP that something has raised, so unstimulated cells give no window."
traps = ["no_forskolin"]
status = "draft"

[[rule]]
id = "block-the-phosphodiesterases"
env = "gi_camp_potency"
said = "Put IBMX in the stimulation buffer."
why = "Without a PDE inhibitor the cells break cAMP down as fast as they make it, so the signal sits at a low steady state near the bottom of the standard curve."
traps = ["no_ibmx"]
status = "draft"

[[rule]]
id = "camp-through-the-standard-curve"
env = "gi_camp_potency"
said = "Convert the ratio to cAMP through the standard curve before fitting potency."
why = "The competitive readout is not proportional to cAMP, so a raw-ratio fit puts the midpoint in the wrong place."
traps = ["raw_ratio"]
status = "draft"

[[rule]]
id = "pin-the-forskolin-plateau"
env = "gi_camp_potency"
said = "Pin the top of every inhibition curve on the forskolin-only controls."
why = "The uninhibited plateau is the high, noisy end of a Gi curve and a potent agonist may never reach it on the ladder, so a free plateau lets the midpoint drift."
traps = ["free_plateau"]
status = "draft"

[[rule]]
id = "titrate-cells-onto-the-curve"
env = "gi_camp_potency"
said = "Titrate the cell number so the forskolin control lands inside the standard curve; more cells is not more signal."
why = "Too many cells make more cAMP than the kit can resolve, so the forskolin control runs onto the flat top of the standard curve."
traps = ["too_many_cells"]
status = "draft"

[[rule]]
id = "mix-the-agonist-ladder"
env = "gi_camp_potency"
said = "Mix after every transfer in the agonist dilution."
why = "An unmixed well is sampled unevenly, and the error compounds down the ladder."
traps = ["no_mix"]
status = "draft"
